<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Report Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container">
    <h2>Report Calculator</h2>

    <div th:if="${successMessage}" class="message success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="message error"   th:text="${errorMessage}"></div>

    <p class="files-count">
        Files added: <strong th:text="${filesCount}">0</strong>
    </p>

    <div id="drop-zone">
        <p>Drag files here or</p>
        <button type="button" id="select-files-btn">Select files</button>
        <input type="file" id="file-input" multiple />
    </div>

    <ul id="file-list"></ul>

    <button type="button" id="upload-btn" disabled>Upload files</button>

    <div class="actions">
        <form th:action="@{/generate}" method="post" style="flex: 2;">
            <button type="submit"
                    class="generate-btn"
                    th:disabled="${filesCount == null or filesCount < 2}">
                Generate CSV report
            </button>
        </form>
        <form th:action="@{/reset}" method="post" style="flex: 1;">
            <button type="submit" class="reset-btn">Reset</button>
        </form>
    </div>
</div>

<div class="footer">
    Created by Pawel Janowicz
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
